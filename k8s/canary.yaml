apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-primary
  labels:
    app: aceest-fitness
    role: primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      role: primary
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: primary
    spec:
      containers:
        - name: aceest-fitness
          image: someshwargaikwad/acetest-fitness-gym-flaskapp:latest
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  labels:
    app: aceest-fitness
    role: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      role: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        role: canary
    spec:
      containers:
        - name: aceest-fitness
          image: someshwargaikwad/acetest-fitness-gym-flaskapp:canary
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
spec:
  selector:
    app: aceest-fitness
    role: primary
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
