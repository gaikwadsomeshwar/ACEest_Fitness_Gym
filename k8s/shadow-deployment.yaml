apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  labels:
    app: aceest-fitness
    deployment: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      deployment: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        deployment: shadow
    spec:
      containers:
        - name: aceest-fitness
          image: someshwargaikwad/acetest-fitness-gym-flaskapp:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow-service
spec:
  selector:
    app: aceest-fitness
    deployment: shadow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
