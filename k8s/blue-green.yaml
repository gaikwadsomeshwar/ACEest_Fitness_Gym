apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-blue
  labels:
    app: aceest-fitness
    release: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      release: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        release: blue
    spec:
      containers:
        - name: aceest-fitness
          image: someshwargaikwad/acetest-fitness-gym-flaskapp:latest
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
  labels:
    app: aceest-fitness
    release: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      release: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        release: green
    spec:
      containers:
        - name: aceest-fitness
          image: someshwargaikwad/acetest-fitness-gym-flaskapp:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-bluegreen-service
spec:
  selector:
    app: aceest-fitness
    release: green
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
