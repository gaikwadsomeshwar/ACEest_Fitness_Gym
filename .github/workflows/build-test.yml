name: ACEest Fitness CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & Lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Syntax check: stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style and complexity check (exit-zero treats as warnings)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Docker Image Assembly
        run: |
          docker build -t aceest-fitness-app:latest .

      - name: Automated Testing (Containerized)
        run: |
          # Execute the Pytest suite inside the containerized environment to confirm stability
          docker run --rm aceest-fitness-app:latest pytest
