<!-- Base Template: Defines the common layout, header, and styles for all pages -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACEest Fitness Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #ddd; margin: 0; padding: 0; }
        header { background-color: #d4af37; color: black; padding: 20px; text-align: center; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        a { color: #d4af37; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #444; text-align: left; }
        th { background-color: #333; }
        input, select { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #d4af37; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .flash { background-color: #e74c3c; color: white; padding: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>ACEest Functional Fitness</h1>
    </header>
    <div class="container">
        <!-- Flash Messages: Display success/error notifications -->
        {% for message in get_flashed_messages() %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
