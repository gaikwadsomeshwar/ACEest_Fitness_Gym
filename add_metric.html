<!-- Log Metrics Form: Allows tracking weight and body stats -->
{% extends 'base.html' %}

{% block content %}
    <h2>Log Body Metrics</h2>
    <form method="post">
        <label>Date</label>
        <input type="date" name="date" value="{{ today }}" required>

        <label>Weight (kg)</label>
        <input type="number" name="weight" step="0.1" required>

        <label>Waist (cm)</label>
        <input type="number" name="waist" step="0.1">

        <label>Body Fat (%)</label>
        <input type="number" name="bodyfat" step="0.1">

        <button type="submit">Save Metrics</button>
    </form>
    <br>
    <a href="{{ url_for('client_detail', client_id=client_id) }}">Cancel</a>
{% endblock %}
